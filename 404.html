<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O GitHub Pages serve esta página em qualquer caminho inexistente (/projects/x/y), então os
         endereços relativos partem da raiz do site. O <base> fica no HTML para o navegador já
         pré-carregar o CSS do lugar certo; aberto direto do disco (file://), aponta para a pasta deste arquivo. -->
    <base href="/">
    <script>
        if (location.protocol === 'file:') document.querySelector('base').href = location.href.replace(/[^/]*([?#].*)?$/, '');
    </script>
    <title>Página não encontrada | Azevedo Tech Solutions</title>
    <meta name="description" content="A página que você procurou não existe ou mudou de endereço.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="icons/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script>
        // Aplica o tema salvo (ou ?theme=) antes da primeira pintura, para a página não piscar.
        (function () {
            try {
                var theme = new URLSearchParams(location.search).get('theme');
                if (theme !== 'light' && theme !== 'dark') theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="css/styles.css?v=20261012e">
    <link rel="stylesheet" href="css/project.css?v=20261012d">
</head>
